<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTPORT // TERMINAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --accent: rgb(88, 166, 255);
            --text: #c9d1d9;
            --border: rgba(88, 166, 255, 0.4);
            --card-bg: rgba(13, 17, 23, 0.94);
            --nytrox: #ff003c; /* Nytrox Red */
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            transition: background-color 2.5s ease; 
        }

        #plexus-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 70px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--accent); 
            margin-bottom: 25px;
            display: inline-block;
            overflow: hidden;
            background: #000;
        }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }

        .content-box {
            max-width: 900px;
            width: 100%;
            background: rgba(13, 17, 23, 0.9);
            border-left: 5px solid var(--accent);
            padding: 40px;
            border-radius: 0 8px 8px 0;
        }

        .contact-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            color: var(--accent);
            border: 1px solid var(--accent);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        .contact-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .item-card {
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .project-btn { border: 2px solid var(--accent) !important; padding: 25px; }
        .project-btn:hover { box-shadow: 0 0 20px var(--accent); transform: translateY(-3px); }

        /* NytroxRAT Specific Style */
        .nytrox-entry { border-color: var(--nytrox) !important; position: relative; overflow: hidden; }
        .nytrox-entry::before {
            content: "BREACH_PROTOCOL";
            position: absolute; top: 5px; right: 5px;
            font-size: 8px; color: var(--nytrox); opacity: 0.5;
        }
        .nytrox-entry:hover { box-shadow: 0 0 30px var(--nytrox) !important; border-color: #fff !important; }

        .tag {
            font-size: 0.75em;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .socials { display: flex; justify-content: center; gap: 40px; margin-top: 30px; }
        .socials a { color: var(--text); font-size: 2.3em; }

        .scroll-reminder {
            position: fixed; bottom: 30px; right: 30px;
            font-size: 0.8em; letter-spacing: 2px;
            color: var(--accent); opacity: 0.7;
            display: flex; flex-direction: column; align-items: center;
        }
        .scroll-reminder i { animation: bounce 2s infinite; margin-top: 8px; }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-8px);} 60% {transform: translateY(-4px);} }
        .cursor::after { content: '_'; animation: blink 1s infinite; color: var(--accent); }
        @keyframes blink { 50% { opacity: 0; } }

        #terminal-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #05070a; z-index: 9999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: var(--accent); padding: 20px;
        }
    </style>
</head>
<body>

    <div id="terminal-loader">
        <div id="loader-content" style="max-width: 600px; width: 100%;">
            <div id="loader-lines"></div>
            <span class="cursor"></span>
        </div>
    </div>

    <canvas id="plexus-canvas"></canvas>

    <div class="scroll-reminder">
        <span>SCROLL_DOWN</span>
        <i class="fas fa-chevron-down"></i>
    </div>

    <section id="hero">
        <div class="profile-card">
            <div class="profile-img"><img src="pfp.png" alt="GHOSTPORT PFP"></div>
            <h1 id="t-logo"></h1>
            <div id="t-sub" style="margin: 10px 0; min-height: 1.2em;"></div>
            <a href="mailto:umairashik123@gmail.com" class="contact-btn" id="contact-trigger" style="opacity:0; transition: opacity 1.5s;">ESTABLISH_CONNECTION</a>
        </div>
    </section>

    <section id="projects">
        <div class="content-box">
            <h2 id="projects-title"></h2>
            <div class="grid-layout">
                <a href="nytroxrat.html" class="item-card project-btn nytrox-entry">
                    <span class="tag" style="color: var(--nytrox);">[ STATUS: ACTIVE ]</span>
                    <strong style="color: #fff; font-size: 1.2em;">NYTROXRAT_v1.1</strong>
                    <p style="font-size: 0.9em; opacity: 0.8; margin-top: 10px;">C# .NET 9 Remote Monitoring & Control Framework.</p>
                </a>

                <div class="item-card project-btn" style="opacity: 0.4;">
                    <span class="tag">[ STATUS: ARCHIVED ]</span>
                    <strong>LEGACY_SERVICE_01</strong>
                    <p style="font-size: 0.8em;">Encrypted socket communication prototype.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="writeups">
        <div class="content-box">
            <h2 id="thm-title"></h2>
            <div class="grid-layout">
                <a href="https://medium.com/@umairashik123/cracking-cupids-vault-a-ctf-walkthrough-11c00cf290e1" target="_blank" class="item-card project-btn">
                    <span class="tag">[ RUN: CUPID_VAULT ]</span>
                    <strong>Hidden Deep Into My Heart</strong>
                </a>
            </div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('plexus-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let currentRGB = { r: 88, g: 166, b: 255 }; 
        let typedStates = { projects: false, thm: false };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; init(); }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.char = Math.random() > 0.5 ? "1" : "0";
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgb(${currentRGB.r}, ${currentRGB.g}, ${currentRGB.b})`;
                ctx.font = "bold 14px monospace"; 
                ctx.fillText(this.char, this.x, this.y);
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update(); p.draw();
            });
            requestAnimationFrame(animate);
        }

        async function typeEffect(element, text, speed = 40) {
            if(!element) return;
            element.classList.add('cursor');
            for (let char of text) { element.innerHTML += char; await new Promise(r => setTimeout(r, speed)); }
            element.classList.remove('cursor');
        }

        async function runLoader() {
            const lines = ["> INITIALIZING...", "> MOUNTING PROJECTS...", "> ACCESS GRANTED."];
            const container = document.getElementById('loader-lines');
            for (let line of lines) {
                const p = document.createElement('div');
                container.appendChild(p);
                await typeEffect(p, line, 30);
                await new Promise(r => setTimeout(r, 400));
            }
            document.getElementById('terminal-loader').style.display = 'none';
        }

        window.addEventListener('scroll', () => {
            const y = window.scrollY; const h = window.innerHeight;
            if (y > h*0.2 && !typedStates.projects) { 
                typedStates.projects = true; 
                typeEffect(document.getElementById('projects-title'), "CORE_PROJECTS", 60);
            }
            if (y > h*1.2 && !typedStates.thm) { 
                typedStates.thm = true; 
                typeEffect(document.getElementById('thm-title'), "THM_WRITEUPS", 60); 
            }
        });

        window.onload = async () => {
            resize(); animate();
            await runLoader();
            await typeEffect(document.getElementById('t-logo'), 'GHOSTPORT', 60);
            await typeEffect(document.getElementById('t-sub'), 'SECURITY RESEARCHER', 60);
            document.getElementById('contact-trigger').style.opacity = "1";
        };
        window.onresize = resize;
    </script>
</body>
</html>
